name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build app
        run: |
          cd app
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          mkdir -p site
          cp -r app/dist/. site/
      - name: Build spikes
        run: |
          mkdir -p site/spikes
          for d in spikes/*/; do
            n=$(basename "$d")
            [ -f "$d/package.json" ] || continue  # Python/Blender-only spikes have nothing to deploy
            (cd "$d" && pnpm install --frozen-lockfile && pnpm build)
            cp -r "$d/dist" "site/spikes/$n"
          done
          cp spikes/index.html site/spikes/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
