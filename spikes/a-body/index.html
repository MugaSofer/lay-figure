<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spike A: base body</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2a28;color:#eee;font:13px system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  #panel{position:fixed;right:0;top:0;bottom:0;width:min(300px,45vw);overflow:auto;background:#000a;padding:8px;box-sizing:border-box}
  #panel label{display:block;margin:2px 0}
  #panel input[type=range]{width:100%}
  #stats{position:fixed;left:8px;top:8px;white-space:pre-wrap;max-width:50vw;text-shadow:0 1px 2px #000;pointer-events:none}
  button{margin:2px;padding:6px 8px;border:0;border-radius:6px;background:#fff3;color:#fff}
</style></head>
<body>
<div id="stats"></div>
<div id="panel">
  <div><button id="zero">All 0</button><button id="one">All 1</button><button id="rand">Random</button></div>
  <div><button id="pose">Toggle pose</button><button id="wire">Wireframe</button></div>
  <div id="sliders"></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body></html>
